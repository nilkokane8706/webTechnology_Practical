<!DOCTYPE html>
<html>
<head>
    <title>Book JSON</title>
</head>

<body>

    <h2>Book Details</h2>

    <p id="result"></p>

    <script>

        var book = {
            "title": "The Alchemist",
            "author": "Paulo Coelho",
            "price": 350
        };

        document.getElementById("result").innerHTML =
            "Book Title: " + book.title;

    </script>

</body>
</html>
